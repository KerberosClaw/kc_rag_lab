[project]
name = "kc-rag-lab"
version = "0.1.0"
description = "Local RAG pipeline: ingest Markdown docs, chunk, embed, retrieve, and answer — all running on Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "gradio>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
